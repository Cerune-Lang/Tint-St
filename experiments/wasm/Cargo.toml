[package]
name = "tint-wasm"
version = "0.0.0"
edition = "2021"
publish = false
description = "Experimental WebAssembly wrapper around the Cerune compiler for the browser Playground"

# This crate is intentionally excluded from the Tint Cargo workspace. It only
# builds when a sibling checkout of Cerune exists (see docs/playground-architecture.md).
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cerune-lang = { path = "../../../Cerune" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
