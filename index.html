<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <link
      rel="stylesheet"
      href="/src/styles.css"
    />

    <title>Tint*</title>

    <script
      type="module"
      src="/src/main.ts"
    ></script>
  </head>

  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          Tint<span class="star">*</span>
        </div>

        <div class="product">
          Cerune
        </div>
      </header>

      <main class="workspace">
        <!-- LEFT -->
        <section class="panel source-panel">
          <div class="panel-header">
            <div class="source-title">
              <button
                id="file-name"
                class="file-name"
                type="button"
                title="Click to rename"
              >
                Untitled.ceru
              </button>
            </div>

            <div class="file-actions">
              <button
                id="open-button"
                type="button"
              >
                Open
              </button>

              <button
                id="save-button"
                type="button"
              >
                Save
              </button>
            </div>
          </div>

          <div
            id="source-editor"
            aria-label="Cerune source"
          ></div>
        </section>

        <!-- RIGHT -->
        <section class="panel output-panel">
          <div class="observation-header">
            <div class="observation-title">
              Observation
            </div>

            <div class="observation-actions">
              <select
                id="target-select"
                aria-label="Target"
              >
                <option value="x86_64-pc-windows-msvc">
                  Windows x64
                </option>

                <option value="x86_64-unknown-linux-gnu">
                  Linux x86-64
                </option>
              </select>

              <label
                class="heap-option"
                title="--string-heap-limit (bytes)"
              >
                <input
                  id="string-heap-limit"
                  type="number"
                  min="0"
                  step="1"
                  placeholder="str heap"
                />
              </label>

              <label
                class="heap-option"
                title="--array-heap-limit (bytes)"
              >
                <input
                  id="array-heap-limit"
                  type="number"
                  min="0"
                  step="1"
                  placeholder="arr heap"
                />
              </label>

              <label class="origins-option">
                <input
                  id="origins-toggle"
                  type="checkbox"
                />
                Origins
              </label>

              <label
                class="origins-option"
                title="Use SSA for native LIR / ASM / Object"
              >
                <input
                  id="native-ssa-toggle"
                  type="checkbox"
                />
                Native SSA
              </label>

              <button
                id="emit-button"
                type="button"
              >
                Emit
              </button>

              <button
                id="run-button"
                type="button"
                hidden
              >
                Run
              </button>
            </div>
          </div>

          <div class="tab-groups">
            <button
              class="group-tab active"
              data-group="pipeline"
              type="button"
            >
              Pipeline
            </button>

            <button
              class="group-tab"
              data-group="backends"
              type="button"
            >
              Backends
            </button>

            <button
              class="group-tab"
              data-group="execution"
              type="button"
            >
              Execution
            </button>
          </div>

          <div class="backend-groups" hidden>
            <button
              class="backend-tab active"
              data-backend="c"
              type="button"
            >
              C
            </button>

            <button
              class="backend-tab"
              data-backend="llvm"
              type="button"
            >
              LLVM
            </button>

            <button
              class="backend-tab"
              data-backend="qbe"
              type="button"
            >
              QBE
            </button>

            <button
              class="backend-tab"
              data-backend="wasm"
              type="button"
            >
              WASM
            </button>

            <button
              class="backend-tab"
              data-backend="native"
              type="button"
            >
              Native
            </button>

            <button
              class="backend-tab"
              data-backend="vm"
              type="button"
            >
              VM
            </button>
          </div>

          <div class="tabs">
            <!-- Pipeline -->
            <button
              class="tab"
              data-group="pipeline"
              data-output="sources"
              type="button"
            >
              Sources
            </button>

            <button
              class="tab active"
              data-group="pipeline"
              data-output="ir"
              type="button"
            >
              Cerune IR
            </button>

            <button
              class="tab"
              data-group="pipeline"
              data-output="mir"
              type="button"
            >
              MIR
            </button>

            <button
              class="tab"
              data-group="pipeline"
              data-output="ssa"
              type="button"
            >
              SSA
            </button>

            <!-- Backends: C -->
            <button
              class="tab"
              data-group="backends"
              data-backend="c"
              data-output="c"
              type="button"
            >
              Source
            </button>

            <button
              class="tab"
              data-group="backends"
              data-backend="c"
              data-output="cAsm"
              type="button"
            >
              ASM
            </button>

            <!-- Backends: LLVM -->
            <button
              class="tab"
              data-group="backends"
              data-backend="llvm"
              data-output="llvm"
              type="button"
            >
              IR
            </button>

            <button
              class="tab"
              data-group="backends"
              data-backend="llvm"
              data-output="llvmAsm"
              type="button"
            >
              ASM
            </button>

            <!-- Backends: QBE -->
            <button
              class="tab"
              data-group="backends"
              data-backend="qbe"
              data-output="qbe"
              type="button"
            >
              IR
            </button>

            <button
              class="tab"
              data-group="backends"
              data-backend="qbe"
              data-output="qbeAsm"
              type="button"
            >
              ASM
            </button>

            <!-- Backends: WASM -->
            <button
              class="tab"
              data-group="backends"
              data-backend="wasm"
              data-output="wat"
              type="button"
            >
              WAT
            </button>

            <!-- Backends: Native -->
            <button
              class="tab"
              data-group="backends"
              data-backend="native"
              data-output="lir"
              type="button"
            >
              LIR
            </button>

            <button
              class="tab"
              data-group="backends"
              data-backend="native"
              data-output="directAsm"
              type="button"
            >
              ASM
            </button>

            <button
              class="tab"
              data-group="backends"
              data-backend="native"
              data-output="object"
              type="button"
            >
              Object
            </button>

            <!-- Backends: VM -->
            <button
              class="tab"
              data-group="backends"
              data-backend="vm"
              data-output="bytecode"
              type="button"
            >
              Bytecode
            </button>

            <!-- Execution -->
            <button
              class="tab"
              data-group="execution"
              data-output="irOutput"
              type="button"
            >
              IR
            </button>

            <button
              class="tab"
              data-group="execution"
              data-output="mirOutput"
              type="button"
            >
              MIR
            </button>

            <button
              class="tab"
              data-group="execution"
              data-output="ssaOutput"
              type="button"
            >
              SSA
            </button>

            <button
              class="tab"
              data-group="execution"
              data-output="vmOutput"
              type="button"
            >
              VM
            </button>
          </div>

          <pre id="output">Press Emit to generate code.</pre>
        </section>
      </main>

      <footer class="statusbar">
        <div class="status">
          <span
            id="status-dot"
            class="status-dot"
          ></span>

          <span id="status-text">
            Ready
          </span>
        </div>

        <span class="shortcut">
          Ctrl + Enter
        </span>
      </footer>
    </div>
  </body>
</html>
